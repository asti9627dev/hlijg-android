<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تطبيق مادتي - المتكامل</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap');
/* خطوط Almarai مدمجة داخل الملف ولا تحتاج إلى مجلدات خارجية */
:root{--primary-color:#137B7F;--primary-light:#E6F4F4;--bg-color:#F7F9F8;--text-dark:#202320;--text-light:#777;--border-color:#DCE9E8}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Almarai',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-color);color:var(--text-dark);padding-bottom:90px;overflow-x:hidden;font-size:15px}
.page-section{display:none;min-height:100vh}.page-section.active{display:block;animation:slideUpFade .3s ease-out}
@keyframes slideUpFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.header{background:var(--primary-color);padding:30px 20px 45px;border-radius:0 0 30px 30px;color:white;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden;margin-bottom:20px}
.header:before,.header:after{content:'';position:absolute;background:rgba(255,255,255,.08);border-radius:50%}.header:before{width:150px;height:150px;top:-40px;right:-40px}.header:after{width:100px;height:100px;bottom:10px;left:60px}
.header-title,.header-icons{position:relative;z-index:1}.header-title h1{font-size:28px;font-weight:700}.header-title p{font-size:15px;opacity:.9}
.header-icons{display:flex;gap:12px}.icon-btn{background:rgba(255,255,255,.15);width:45px;height:45px;border-radius:50%;display:flex;justify-content:center;align-items:center;color:white;font-size:20px;border:0;cursor:pointer}
.container{padding:0 15px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:white;border-radius:15px;padding:20px 10px;text-align:center;box-shadow:0 4px 10px #00000008;cursor:pointer}
.stat-icon{width:45px;height:45px;border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto 10px;font-size:20px}
.icon-blue,.icon-green{background:var(--primary-light);color:var(--primary-color)}.icon-red{background:#E6F4F4;color:#137B7F}
.stat-card h2{font-size:24px;color:#111}.stat-card p{font-size:14px;color:var(--text-light)}
.banner,.tools-banner{background:var(--primary-color);border-radius:20px;padding:25px 20px;color:white;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;box-shadow:0 4px 15px #137B7F33}
.banner{cursor:pointer}.banner-text h3{font-size:24px;margin-bottom:6px}.banner-text p{font-size:14px;line-height:1.5;opacity:.9}.banner-icon{font-size:45px;opacity:.6}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:0 5px}
.section-header h3{font-size:18px;font-weight:700}.view-all{color:var(--primary-color);font-size:13px;text-decoration:none;font-weight:700}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:25px}
.tool-card{background:white;border-radius:15px;padding:18px 12px;text-align:center;box-shadow:0 3px 10px #00000006;cursor:pointer;transition:.2s}
.tool-card:active{transform:scale(.97)}
.tool-icon{width:50px;height:50px;border-radius:15px;background:var(--primary-light);color:var(--primary-color);display:flex;justify-content:center;align-items:center;margin:0 auto 10px;font-size:22px}
.tool-card h4{font-size:14px;margin-bottom:5px}.tool-card p{font-size:11px;color:var(--text-light)}
.subject-card{background:white;border-radius:15px;padding:15px;display:flex;align-items:center;gap:12px;margin-bottom:12px;box-shadow:0 3px 10px #00000006;cursor:pointer}
.subject-icon{width:45px;height:45px;border-radius:12px;background:var(--primary-light);color:var(--primary-color);display:flex;justify-content:center;align-items:center;font-size:20px;flex-shrink:0}
.subject-info{flex:1}.subject-info h4{font-size:14px;margin-bottom:5px}.subject-info p{font-size:12px;color:var(--text-light)}
.subject-arrow{color:#aaa;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;height:70px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -3px 15px #0000000a;z-index:100;border-radius:20px 20px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#999;font-size:11px;text-decoration:none;flex:1;height:100%;cursor:pointer;border:0;background:transparent}
.nav-item i{font-size:20px}.nav-item.active{color:var(--primary-color);font-weight:700}
.center-btn-wrapper{position:relative;top:-20px;width:60px;height:60px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px #00000012}
.center-btn{width:52px;height:52px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;overflow:hidden}
.center-btn img{width:100%;height:100%;object-fit:contain}
.page-title{font-size:22px;font-weight:700;margin:20px 15px}
.card{background:white;border-radius:15px;padding:18px;margin:0 15px 15px;box-shadow:0 3px 10px #00000006}
.empty-state{text-align:center;padding:45px 20px;color:#999}
.empty-state i{font-size:45px;color:#cbd8d7;margin-bottom:15px}
.empty-state h3{font-size:16px;color:#555;margin-bottom:8px}
.empty-state p{font-size:13px;line-height:1.7}
.primary-btn{background:var(--primary-color);color:white;border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700}
.secondary-btn{background:var(--primary-light);color:var(--primary-color);border:0;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700}
input,textarea,select{font-family:inherit}
.form-control{width:100%;padding:13px;border:1px solid var(--border-color);border-radius:10px;background:#fff;font-size:14px;outline:none;margin-bottom:12px}
.form-control:focus{border-color:var(--primary-color)}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#263238;color:white;padding:12px 20px;border-radius:30px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:#0006;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:white;border-radius:20px;padding:22px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-close{border:0;background:#f1f4f4;width:35px;height:35px;border-radius:50%;font-size:18px;color:#555}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf1f1}
.list-row:last-child{border-bottom:0}
.list-row-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);color:var(--primary-color);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-row-content{flex:1;min-width:0}
.list-row-content h4{font-size:13px;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row-content p{font-size:11px;color:#999}
.list-row-action{border:0;background:transparent;color:#999;font-size:16px;padding:8px}
.favorite-btn{color:#aaa;cursor:pointer;border:0;background:transparent;font-size:19px}
.favorite-btn.active{color:#e85b68}
.progress-track{height:6px;background:#edf1f1;border-radius:10px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;width:0;background:var(--primary-color);border-radius:10px;transition:width .3s}
.download-status{font-size:11px;color:var(--primary-color);margin-top:5px}
.more-list{background:white;border-radius:15px;margin:0 15px 15px;overflow:hidden}
.more-item{display:flex;align-items:center;padding:16px;gap:14px;border-bottom:1px solid #f0f2f2;cursor:pointer}
.more-item:last-child{border-bottom:0}
.more-item i:first-child{width:25px;text-align:center;color:var(--primary-color);font-size:18px}
.more-item span{flex:1;font-size:14px}
.more-item i:last-child{color:#bbb;font-size:13px}
@media(max-width:360px
